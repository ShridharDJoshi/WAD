<!DOCTYPE html>
<html>

<head>

    <title>jQuery Information Website</title>

    <meta name="viewport"
    content="width=device-width, initial-scale=1">

    <!-- jQuery CDN -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Internal CSS -->

    <style>

        body{
            margin:0;
            font-family:Arial;
            background-color:#0d0e3b;
            color:white;
            text-align:center;
        }

        .header{
            background-color:skyblue;
            color:black;
            padding:20px;
            font-size:30px;
            font-weight:bold;
        }

        .container{
            margin-top:50px;
        }

        .info-box{
            width:70%;
            margin:auto;
            background-color:#1f2d3d;
            padding:20px;
            border-radius:10px;
            display:none;
        }

        button{
            width:180px;
            height:45px;
            border:none;
            border-radius:5px;
            background-color:skyblue;
            font-size:18px;
            cursor:pointer;
            margin-top:20px;
        }

        button:hover{
            background-color:white;
        }

        @media(max-width:768px)
        {
            .info-box{
                width:90%;
            }
        }

    </style>

</head>

<body>

    <!-- Header -->

    <div class="header">

        Technology Information Website

    </div>

    <!-- Main Content -->

    <div class="container">

        <h1>Web Development</h1>

        <p>
            Click button to view information
        </p>

        <button id="btn">

            Show Information

        </button>

        <br><br>

        <div class="info-box">

            <h2>About Web Development</h2>

            <p>

                Web development is the process of creating
                websites using HTML, CSS, JavaScript and
                frameworks. It includes frontend and backend
                development.

            </p>

        </div>

    </div>

    <!-- jQuery -->

    <script>

        $(document).ready(function(){

            $("#btn").click(function(){

                $(".info-box").slideToggle();

            });

        });

    </script>

</body>

</html>
