<!DOCTYPE html>
<html>
<head>

    <title>SPPU WAD Practical 4A</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- jQuery Mobile CSS -->
    <link rel="stylesheet"
    href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-1.11.3.min.js"></script>

    <!-- jQuery Mobile -->
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

</head>

<body style="background-color:black;font-family:cursive">

<!-- PAGE -->
<div data-role="page" id="home" style="background-color:black;">

    <!-- HEADER -->
    <div data-role="header"
    style="background-color:skyblue;color:black;">

        <h1>jQuery Mobile</h1>

    </div>

    <!-- MAIN CONTENT -->
    <div data-role="main" class="ui-content">

        <center>

            <h2 style="color:white;">
                Welcome to Shridhar's Page 🥳
            </h2>

            <h3 style="color:white;">
                Please Login or Register
            </h3>

        </center>

        <!-- LOGIN BUTTON -->
        <center>
        <a href="First.html"
        class="ui-btn ui-corner-all ui-shadow"
        style="background-color:rgb(3, 143, 29);color:white;width:30%;">

            Login

        </a>
        </center>   

        <center>
            <h3 style="color:white;">OR</h3>
        </center>

        <!-- FORM BOX -->
        <div style="
            background-color:#222;
            padding:20px;
            border-radius:15px;
            max-width:500px;
            margin:auto;
            color:white;
        ">

            <label for="username">
                Enter Your Name:
            </label>
            <input type="text"
            id="username"
            placeholder="Enter Username">

            <br>

            <label for="email">
                Enter Email Address:
            </label>
            <input type="email"
            id="email"
            placeholder="Enter Email">

            <br>

            <label for="password">
                Enter Password:
            </label>
            <input type="password"
            id="password"
            placeholder="Password">

            <br>

            <label for="confirm">
                Confirm Password:
            </label>
            <input type="password"
            id="confirm"
            placeholder="Confirm Password">

            <br>

            <a href="First.html"
            class="ui-btn ui-corner-all ui-shadow"
            style="background-color:skyblue;color:black;">

                Register

            </a>

        </div>

    </div>

    <!-- FOOTER -->
    <div data-role="footer"
    data-position="fixed"
    style="background-color:skyblue;color:black;">

        <h4>Good to have you here!</h4>

    </div>

</div>

</body>
</html>
