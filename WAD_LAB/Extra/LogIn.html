<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure login page">
    <title>Login - Your Website</title>
    <link rel="stylesheet" href="LogIn.css">
</head>
<body>
    <main class="login-container">
        <div class="login-box">
            <h1>Welcome Back</h1>
            <p class="subtitle">Please login to your account</p>
            
            <form class="login-form" method="POST" action="#" novalidate>
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Enter your full name"
                        required
                        aria-label="Full Name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                        aria-label="Email Address">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        aria-label="Password">
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" aria-label="Remember me">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                <button type="button" class="btn-login" onclick="window.location.href='First.html'">Log In</button>
            </form>
            <p class="signup-link">
                Don't have an account? <a href="#">Sign up here</a>
            </p>
        </div>
    </main>
</body>
</html>
